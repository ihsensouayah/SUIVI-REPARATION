name: Synchro Odoo -> Suivi Réparation

on:
  workflow_dispatch: {}          # bouton « Run workflow » pour lancer à la main
  schedule:
    - cron: "38 8,13 * * 1-6"    # 9h38 et 14h38 (heure de Tunis), du lundi au samedi

concurrency:
  group: suivi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agent/requirements.txt
      - name: Lire Odoo et mettre à jour le dashboard
        working-directory: agent
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python suivi_sync.py
